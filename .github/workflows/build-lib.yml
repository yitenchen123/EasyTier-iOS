name: Build Rust static library for iOS

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust
        uses: actions-rs/toolchain@v1
        with:
          toolchain: stable
          target: aarch64-apple-ios
          override: true

      - name: Build static lib (in Core directory)
        working-directory: Core   # 关键：切换到 Core 目录
        run: |
          cargo build --release --target aarch64-apple-ios
          # 产物位于 Core/target/aarch64-apple-ios/release/libeasytier_ios.a

      - name: Copy static library to root
        run: |
          cp Core/target/aarch64-apple-ios/release/libeasytier_ios.a .
          strip -S libeasytier_ios.a

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: libeasytier_ios.a
          path: libeasytier_ios.a

      - name: Release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v1
        with:
          files: libeasytier_ios.a
          tag_name: ${{ github.ref_name }}
          body: "iOS arm64 static library for EasyTier (built from Core/)"