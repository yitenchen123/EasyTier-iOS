name: Upload easytier-core artifact

on:
  push:
    branches: [ main ]
    paths:
      - 'Core/easytier-core'   # 当二进制文件更新时触发
  workflow_dispatch:           # 也可手动触发

jobs:
  upload:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: easytier-core
          path: Core/easytier-core