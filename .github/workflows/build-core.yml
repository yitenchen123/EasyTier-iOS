name: Build easytier-core for iOS

on:
  push:
    tags:
      - 'v*'                # 推送 v1.0.0, v1.0.1 等时触发
  workflow_dispatch:        # 也可以手动触发

jobs:
  build:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: actions-rs/toolchain@v1
        with:
          toolchain: stable
          target: aarch64-apple-ios
          override: true

      - name: Build release binary for iOS
        working-directory: Core
        run: |
          cargo build --release --target aarch64-apple-ios
          # 产物路径: target/aarch64-apple-ios/release/easytier-core

      - name: Strip debug symbols
        run: |
          strip -S Core/target/aarch64-apple-ios/release/easytier-core -o easytier-core

      - name: Upload binary to release (when tag is pushed)
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v1
        with:
          files: easytier-core
          tag_name: ${{ github.ref_name }}
          body: |
            ## easytier-core for iOS (arm64)
            
            此二进制文件适用于 iOS 设备，可被 CraftLink 等应用使用。
            
            ### 使用方法
            下载后放入 App Bundle 的 `Core/` 目录，并确保可执行权限。

      - name: Upload as artifact (always)
        uses: actions/upload-artifact@v4
        with:
          name: easytier-core
          path: easytier-core