name: Build CraftLink IPA (unsigned)

# CraftLink IPA 构建。
#
# 注意：GitHub Actions 只识别仓库根目录的 .github/workflows/，
# CraftLink 项目代码在 CraftLink/ 子目录下，因此本 workflow 使用
# defaults.run.working-directory: CraftLink 让所有 run 步骤在该子目录执行。
#
# 触发方式：
#   - push 到 main：自动构建 IPA
#   - 推 v* tag：构建 IPA 并发布到 Release
#   - workflow_dispatch：手动触发（可勾选 rebuild_lib 强制重编译 Rust）

on:
  push:
    branches:
      - main
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      rebuild_lib:
        description: '重新编译 libterracotta.a（改了 lib_ios.rs 或补丁脚本时勾选）'
        type: boolean
        default: false

defaults:
  run:
    working-directory: CraftLink

jobs:
  build-ipa:
    name: Build CraftLink IPA
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4

      - name: Install xcodegen and ldid
        run: |
          brew install xcodegen
          brew install ldid

      # ===== 检测 libterracotta.a 是否需要重建 =====
      # 当 RustLib/libterracotta.a 不含 terracotta_ios_start_host_with_port 符号时自动重建
      - name: Check if libterracotta.a needs rebuild
        id: needrebuild
        run: |
          if [[ -f RustLib/libterracotta.a ]] && nm RustLib/libterracotta.a 2>/dev/null | grep -q terracotta_ios_start_host_with_port; then
            echo "need=false" >> $GITHUB_OUTPUT
            echo "✅ libterracotta.a 已含 start_host_with_port 符号，无需重建"
          else
            echo "need=true" >> $GITHUB_OUTPUT
            echo "⚠️ libterracotta.a 缺少 start_host_with_port 符号，需要重建"
          fi

      - name: Install Rust nightly + iOS targets
        if: steps.needrebuild.outputs.need == 'true' || github.event.inputs.rebuild_lib == 'true'
        run: |
          rustup toolchain install nightly --profile minimal
          rustup component add rust-src --toolchain nightly
          rustup target add aarch64-apple-ios --toolchain nightly
          rustup default nightly
          brew install protobuf

      - name: Clone Terracotta + EasyTier and rebuild libterracotta.a
        if: steps.needrebuild.outputs.need == 'true' || github.event.inputs.rebuild_lib == 'true'
        run: |
          # ../Terracotta 和 ../EasyTier 会 clone 到仓库根目录（CraftLink 的上级）
          git clone --depth=1 https://github.com/burningtnt/Terracotta.git ../Terracotta
          git clone --depth=1 -b main https://github.com/burningtnt/EasyTier.git ../EasyTier
          echo "TERRACOTTA_SHA=$(cd ../Terracotta && git rev-parse HEAD)" >> $GITHUB_ENV
          python3 scripts/patch_terracotta_for_ios.py ../Terracotta ../EasyTier
          cat >> ../Terracotta/Cargo.toml <<'CARGOEOF'

          [patch."https://github.com/burningtnt/EasyTier.git"]
          easytier = { path = "../EasyTier/easytier" }
          CARGOEOF
          cd ../Terracotta
          TERRACOTTA_VERSION=terracotta-${TERRACOTTA_SHA} cargo +nightly build --lib --release --target aarch64-apple-ios
          cp target/aarch64-apple-ios/release/libterracotta.a $GITHUB_WORKSPACE/CraftLink/RustLib/libterracotta.a
          echo "✅ libterracotta.a 重新编译完成"
          ls -la $GITHUB_WORKSPACE/CraftLink/RustLib/libterracotta.a

      - name: Verify libterracotta.a
        run: |
          echo "=== 检查 libterracotta.a ==="
          if [[ ! -f RustLib/libterracotta.a ]]; then
            echo "❌ RustLib/libterracotta.a 不存在！"
            echo "请在 GitHub Actions 页面手动触发 build workflow 并勾选 rebuild_lib。"
            exit 1
          fi
          ls -la RustLib/libterracotta.a
          file RustLib/libterracotta.a
          lipo -info RustLib/libterracotta.a || true

      # 重建后上传 .a artifact，方便下载后提交到 RustLib/ 让后续构建回到快速模式
      - name: Upload rebuilt libterracotta.a (if rebuilt)
        if: steps.needrebuild.outputs.need == 'true' || github.event.inputs.rebuild_lib == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: libterracotta-rebuilt
          path: CraftLink/RustLib/libterracotta.a
          retention-days: 14

      - name: Generate Xcode project
        run: xcodegen generate

      - name: Ensure entitlements contain multicast permission
        run: |
          # 房主侧 Terracotta 的 MinecraftScanner 需要 join 多播组 224.0.2.60:4445
          # 以接收 Minecraft「对局域网开放」LAN 广播。iOS 15+ 上没有
          # com.apple.developer.networking.multicast entitlement 时
          # setsockopt(IP_ADD_MEMBERSHIP) 会失败（EPERM），导致永远检测不到
          # MC 端口（host-scanning 卡住）。
          #
          # 手动端口模式可绕过多播，但保留此权限以支持自动扫描模式。
          python3 - <<'PYEOF'
          ent_content = '''<?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0">
          <dict>
              <key>com.apple.developer.networking.multicast</key>
              <true/>
          </dict>
          </plist>
          '''
          with open('CraftLink.entitlements', 'w') as f:
              f.write(ent_content)
          print("=== CraftLink.entitlements ===")
          print(ent_content)
          PYEOF

      - name: Build unsigned .app
        run: |
          xcodebuild build \
            -project CraftLink.xcodeproj \
            -scheme CraftLink \
            -configuration Release \
            -sdk iphoneos \
            -destination 'generic/platform=iOS' \
            CODE_SIGN_IDENTITY="" \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGNING_ALLOWED=NO \
            -derivedDataPath build/derivedData

      - name: Ad-hoc sign binary with entitlements (TrollStore 兼容)
        run: |
          APP_PATH=$(find build/derivedData/Build/Products/Release-iphoneos -name "*.app" | head -n1)
          echo "App path: $APP_PATH"

          # 规范化 entitlements 文件
          plutil -convert xml1 CraftLink.entitlements
          plutil -lint CraftLink.entitlements

          # 复制 entitlements 到包内
          cp CraftLink.entitlements "$APP_PATH/"

          # CODE_SIGNING_ALLOWED=NO 下二进制无签名段，先 ad-hoc fakesign 再嵌权限
          echo "Step 1: ad-hoc fakesign binary..."
          ldid -S "$APP_PATH/CraftLink"

          echo "Step 2: embed entitlements into signed binary..."
          ldid -S"$APP_PATH/CraftLink.entitlements" "$APP_PATH/CraftLink"

          echo "✅ Entitlements embedded. Verifying..."
          ldid -e "$APP_PATH/CraftLink" || echo "(empty entitlements — expected for non-NE app)"

      - name: Package IPA
        run: |
          APP_PATH=$(find build/derivedData/Build/Products/Release-iphoneos -name "*.app" | head -n1)
          mkdir -p Payload
          cp -R "$APP_PATH" Payload/
          zip -r CraftLink.ipa Payload

      - name: Upload IPA
        uses: actions/upload-artifact@v4
        with:
          name: CraftLink-unsigned.ipa
          path: CraftLink/CraftLink.ipa

      - name: Release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v1
        with:
          files: CraftLink/CraftLink.ipa
